services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: opzy
      POSTGRES_PASSWORD: opzy
      POSTGRES_DB: opzy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://opzy:opzy@db:5432/opzy
      REDIS_URL: redis://redis:6379/0
    command: uv run python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://opzy:opzy@db:5432/opzy
      REDIS_URL: redis://redis:6379/0
    command: uv run celery -A config worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

volumes:
  pgdata:
